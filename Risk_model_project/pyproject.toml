[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tanaka-drug-risk-model"
version = "0.1.0"
description = "Substance Abuse Risk Machine Learning Pipeline and Evaluation Tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "streamlit>=1.25.0",
]

[project.scripts]
run-risk-model = "risk_model.pipeline:main"
